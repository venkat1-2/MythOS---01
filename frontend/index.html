/* ── Top-Level React Error Boundary ── */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error('[REACT ERROR BOUNDARY CAUGHT CRASH]', error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="p-8 m-6 bg-red-950/90 border-2 border-red-500 rounded-2xl text-red-200 space-y-4">
          <div className="flex items-center gap-3 text-red-400 font-bold text-lg">
            <Icons.AlertTriangle className="w-6 h-6" />
            <span>Upload / Render Failure</span>
          </div>
          <p className="text-sm font-semibold">
            Upload failed or an unexpected rendering error occurred:
          </p>
          <div className="p-4 bg-slate-950 rounded-xl font-mono text-xs text-red-300 overflow-x-auto">
            {this.state.error ? this.state.error.toString() : 'Unknown Error'}
          </div>
          <button
            onClick={() => window.location.reload()}
            className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded-xl transition"
          >
            Reload Dashboard
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function CashFlowView({ lang, profileMode, uploadedFull, onFullAnalysis }) {
  const L = LABELS[lang] || LABELS.en;
  const [summary, setSummary] = useState(null);
  const [forecast, setForecast] = useState(null);      // CSV forecast result
  const [threshold, setThreshold] = useState(500000);
  const [thresholdInput, setThresholdInput] = useState('500000');
  const [uploading, setUploading] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const [csvFilename, setCsvFilename] = useState(null);
  const [error, setError] = useState(null);
  const [ledgerReviewData, setLedgerReviewData] = useState(null);
  // Upload-time business metadata
  const [businessName, setBusinessName] = useState('');
  const [keyMaterials, setKeyMaterials] = useState('');
  const [supplierCountries, setSupplierCountries] = useState('');
  // Scheme-finder profile fields
  const [sector, setSector] = useState('');
  const [businessType, setBusinessType] = useState('manufacturing');
  const [businessState, setBusinessState] = useState('');
  const [womenOwned, setWomenOwned] = useState(false);
  const [exportOriented, setExportOriented] = useState(false);

  // chart refs
  const overviewChartRef = useRef(null);
  const overviewChartInst = useRef(null);
  const forecastChartRef  = useRef(null);
  const forecastChartInst = useRef(null);

  /* fetch mock summary on mount */
  useEffect(() => {
    fetch(`${API}/cash-flow`).then(r=>r.json()).then(setSummary).catch(console.error);
  }, []);

  const handleFileUpload = async (file) => {
    if (!file) return;
    setUploading(true); setError(null);
    try {
      const isImage = file.type.startsWith('image/') || /\.(png|jpe?g|webp)$/i.test(file.name);
      if (isImage) {
        const form = new FormData();
        form.append('file', file);
        const res = await fetch(`${API}/cash-flow/analyze-ledger-photo`, {
          method: 'POST',
          body: form
        });
        if (!res.ok) {
          throw new Error(`Server returned HTTP ${res.status}: ${res.statusText}`);
        }
        const data = await res.json();
        if (data.error) {
          setError(data.error);
        } else if (data.transactions && data.transactions.length > 0) {
          setLedgerReviewData({
            filename: file.name,
            rows: data.transactions
          });
        } else {
          setError('No valid transactions extracted from photo.');
        }
      } else {
        const reader = new FileReader();
        reader.onload = e => submitCSV(e.target.result, file.name);
        reader.readAsText(file);
      }
    } catch (e) {
      console.error('[FILE UPLOAD ERROR]', e);
      setError(`File Processing Error: ${e.message || e}`);
    }
    setUploading(false);
  };

  const confirmLedgerTransactions = (editedRows, filename) => {
    const csvHeader = "date,description,amount";
    const csvLines = editedRows.map(r => `${r.date},"${(r.description || '').replace(/"/g, '""')}",${r.amount}`);
    const csvText = [csvHeader, ...csvLines].join("\n");

    setLedgerReviewData(null);
    submitCSV(csvText, `[Ledger Photo] ${filename}`);
  };

  const activeSummary = (profileMode === 'uploaded' && uploadedFull) ? uploadedFull.cash_flow : summary;

  /* draw overview chart when summary/profileMode changes */
  useEffect(() => {
    if (!activeSummary || !overviewChartRef.current) return;
    if (overviewChartInst.current) overviewChartInst.current.destroy();
    const ctx = overviewChartRef.current.getContext('2d');
    const fc = activeSummary.forecast_chart;
    overviewChartInst.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: fc.map(x=>x.month),
        datasets: [
          { label:'Inflow (₹L)', data: fc.map(x=>+(x.inflow/100000).toFixed(2)), borderColor:'#22c55e', backgroundColor:'rgba(34,197,94,.1)', fill:true, tension:.4, borderWidth:3, pointRadius:4, pointBackgroundColor:'#22c55e' },
          { label:'Outflow (₹L)', data: fc.map(x=>+(x.outflow/100000).toFixed(2)), borderColor:'#ef4444', backgroundColor:'rgba(239,68,68,.05)', fill:true, tension:.4, borderWidth:2, borderDash:[5,5], pointRadius:3, pointBackgroundColor:'#ef4444' }
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:'#94a3b8', font:{ family:'Plus Jakarta Sans' } } } },
        scales:{
          x:{ grid:{ color:'rgba(255,255,255,.05)' }, ticks:{ color:'#94a3b8' } },
          y:{ grid:{ color:'rgba(255,255,255,.05)' }, ticks:{ color:'#94a3b8', callback:v=>`₹${v}L` } }
        }
      }
    });
  }, [activeSummary, profileMode]);

  const activeForecast = (profileMode === 'uploaded' && uploadedFull?.cash_flow?.raw_forecast)
    ? uploadedFull.cash_flow.raw_forecast
    : forecast;

  /* re-draw forecast chart whenever activeForecast or threshold changes */
  useEffect(() => {
    if (!activeForecast || !forecastChartRef.current) return;
    if (forecastChartInst.current) forecastChartInst.current.destroy();
    const ctx = forecastChartRef.current.getContext('2d');

    const histDates    = activeForecast.historical_chart.map(x=>x.date);
    const histBal      = activeForecast.historical_chart.map(x=>x.balance);
    const projDates    = activeForecast.forecast_chart.map(x=>x.date);
    const projBal      = activeForecast.forecast_chart.map(x=>x.balance);
    const labels       = [...histDates, ...projDates];
    const histData     = [...histBal, ...new Array(projDates.length).fill(null)];
    const projData     = [...new Array(histDates.length).fill(null), ...projBal];
    const threshLine   = new Array(labels.length).fill(threshold);
    const dangerFill   = projBal.map(b => b < threshold ? b : threshold);
    const dangerData   = [...new Array(histDates.length).fill(null), ...dangerFill];

    forecastChartInst.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Historical Balance',
            data: histData,
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99,102,241,.1)',
            fill: true,
            tension: .3,
            borderWidth: 2,
            pointRadius: 0,
            spanGaps: false,
          },
          {
            label: '30-Day Forecast (WMA)',
            data: projData,
            borderColor: '#22c55e',
            backgroundColor: 'rgba(34,197,94,.08)',
            fill: true,
            tension: .3,
            borderWidth: 2.5,
            borderDash: [6, 3],
            pointRadius: 3,
            pointBackgroundColor: '#22c55e',
            spanGaps: false,
          },
          {
            label: `Threshold (${fmt(threshold)})`,
            data: threshLine,
            borderColor: '#ef4444',
            borderWidth: 1.5,
            borderDash: [4, 4],
            pointRadius: 0,
            fill: false,
          },
          {
            label: 'Danger Zone',
            data: dangerData,
            borderColor: 'transparent',
            backgroundColor: 'rgba(239,68,68,.18)',
            fill: true,
            tension: .3,
            pointRadius: 0,
            spanGaps: false,
          },
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode:'index', intersect:false },
        plugins: {
          legend: { labels:{ color:'#94a3b8', font:{ family:'Plus Jakarta Sans' }, filter: item => item.text !== 'Danger Zone' } },
          tooltip: {
            callbacks: {
              label: ctx => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}`
            }
          }
        },
        scales: {
          x: {
            grid: { color:'rgba(255,255,255,.04)' },
            ticks: {
              color:'#94a3b8', maxTicksLimit:12,
              callback: function(val, idx) {
                const lbl = labels[idx];
                if (!lbl) return '';
                // mark where forecast starts
                if (lbl === projDates[0]) return '▶ ' + lbl.slice(5);
                return lbl.slice(5); // MM-DD
              }
            }
          },
          y: {
            grid: { color:'rgba(255,255,255,.04)' },
            ticks: { color:'#94a3b8', callback: v => `₹${(v/100000).toFixed(1)}L` }
          }
        }
      }
    });
  }, [activeForecast, threshold]);

  /* ── CSV helpers ── */
  const submitCSV = async (text, name) => {
    setUploading(true); setError(null);
    try {
      if (!text || !text.trim()) {
        throw new Error("CSV file is empty.");
      }
      window._lastCsvText = text;
      const form = new FormData();
      form.append('csv_text', text);
      form.append('threshold', threshold.toString());
      form.append('sector', sector.trim());
      form.append('business_type', businessType || 'manufacturing');
      form.append('state', businessState.trim());
      form.append('women_owned', womenOwned ? 'true' : 'false');
      form.append('export_oriented', exportOriented ? 'true' : 'false');
      
      const res = await fetch(`${API}/cash-flow/analyze-csv-full`, { method:'POST', body: form });
      if (!res.ok) {
        throw new Error(`Server returned HTTP ${res.status}: ${res.statusText}`);
      }
      const data = await res.json();
      if (data.error) {
        console.error('[CSV PARSE/FORECAST ERROR]', data.error);
        setError(data.error);
      } else {
        const rawFc = data.fc_raw || data;
        setForecast(rawFc);
        setCsvFilename(name);

        const resolvedName = businessName.trim() || 'My Business';
        const parsedMaterials = keyMaterials.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
        const parsedCountries = supplierCountries.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);

        const fullProfile = {
          ...data,
          company_profile: {
            ...data.company_profile,
            name: resolvedName,
          },
          global_exposure: {
            name: resolvedName,
            sector: sector.trim() || 'Business (CSV Uploaded)',
            materials: parsedMaterials,
            supplier_countries: parsedCountries,
            export_markets: exportOriented ? ['global'] : [],
            currency_exposure: parsedCountries.includes('usa') || parsedCountries.includes('us') ? ['usd', 'inr'] : ['inr'],
            energy_dependent: false,
            logistics_modes: ['road']
          },
          cash_flow: {
            ...data.cash_flow,
            raw_forecast: rawFc,
          }
        };

        if (onFullAnalysis) {
          onFullAnalysis(fullProfile, name);
        }
      }
    } catch(e) {
      console.error('[CSV SUBMIT FAILURE]', e);
      setError(`CSV Processing Error: ${e.message || e}`);
    }
    setUploading(false);
  };

  const loadSample = async () => {
    setUploading(true); setError(null);
    try {
      const res  = await fetch(`${API}/cash-flow/sample-csv`);
      if (!res.ok) throw new Error(`Could not fetch sample CSV: HTTP ${res.status}`);
      const text = await res.text();
      await submitCSV(text, 'sample_transactions_90d.csv');
    } catch(e) {
      console.error('[LOAD SAMPLE ERROR]', e);
      setError(`Could not fetch sample CSV: ${e.message}`);
    }
    setUploading(false);
  };

  const downloadSample = () => window.open(`${API}/cash-flow/sample-csv`, '_blank');

  const applyThreshold = () => {
    const val = parseFloat(thresholdInput.replace(/,/g,''));
    if (!isNaN(val) && val >= 0) setThreshold(val);
  };

  const reanalyze = async () => {
    if (!forecast || !window._lastCsvText) return;
    await submitCSV(window._lastCsvText, csvFilename || 'sample_transactions_90d.csv');
  };

  if (!activeSummary) return <div className="p-8 text-center text-slate-400">{L.loadCashFlow}</div>;

  const s = activeSummary.summary || activeSummary;
  const wc = activeSummary.working_capital || {};

  return (
    <div className="space-y-6">
      {/* ── KPI cards ── */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        {[
          { label: L.cfKpi1, value: fmtL(s.current_balance), sub: s.starting_balance ? `${s.current_balance >= s.starting_balance ? '+' : ''}${(((s.current_balance - s.starting_balance)/s.starting_balance)*100).toFixed(1)}% change since start` : 'Based on 90-day statement', Icon:Icons.Wallet, color:'text-emerald-400' },
          { label: L.cfKpi2, value:`${s.net_cashflow>=0?'+':''}${fmtL(s.net_cashflow)}`, sub:`Money in: ${fmtL(s.monthly_inflow)} · Out: ${fmtL(s.monthly_outflow)}`, Icon:Icons.TrendUp, color:'text-teal-400' },
          { label: L.cfKpi3, value:`${s.runway_months} Months`, sub: s.runway_months >= 3 ? 'Comfortable (>3 months)' : 'Low — action needed (<3 mo)', Icon:Icons.Clock, color:'text-indigo-400' },
          { label: L.cfKpi4, value:`${wc.dso_days} Days`, sub:`Days Sales Outstanding (DSO)`, Icon:Icons.Hourglass, color:'text-amber-400' },
        ].map(({ label, value, sub, Icon, color }) => (
          <div key={label} className="glass glass-h p-5 rounded-2xl">
            <div className="flex items-center justify-between text-slate-400 text-xs font-medium">
              <span>{label}</span><Icon className={`w-4 h-4 ${color}`}/>
            </div>
            <div className={`text-xl font-bold mt-2 ${color}`}>{value}</div>
            <div className="text-xs text-slate-400 mt-1">{sub}</div>
          </div>
        ))}
      </div>

      {/* ── Overview chart ── */}
      <div className="glass p-6 rounded-2xl">
        <h3 className="text-base font-bold text-white mb-1">{L.cfOverviewTitle}</h3>
        <p className="text-xs text-slate-400 mb-4">{L.cfOverviewSub}</p>
        <div className="h-64"><canvas ref={overviewChartRef}></canvas></div>
      </div>

      {/* ══════════════════════════════════════════════
          CSV FORECASTING MODULE
      ══════════════════════════════════════════════ */}
      <div className="glass rounded-2xl overflow-hidden border border-slate-800">
        <div className="px-6 py-4 border-b border-slate-800 bg-slate-900/50 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <div>
            <h3 className="text-base font-bold text-white flex items-center gap-2">
              <Icons.Activity className="w-5 h-5 text-emerald-400"/>
              {L.cfForecastTitle}
            </h3>
            <p className="text-xs text-slate-400 mt-0.5">{L.cfForecastSub}</p>
          </div>
          <div className="flex gap-2 shrink-0">
            <button onClick={downloadSample} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-slate-700 transition">
              <Icons.Download className="w-3.5 h-3.5"/>{L.cfSampleCsv}
            </button>
            <button onClick={loadSample} disabled={uploading} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold transition disabled:opacity-50">
              <Icons.Sparkles className="w-3.5 h-3.5"/>{uploading ? L.cfAnalysing : L.cfLoadSample}
            </button>
          </div>
        </div>

        <div className="p-6 space-y-6">
          {/* Business metadata inputs */}
          <div className="glass rounded-xl p-5 border border-slate-800 space-y-4">
            <div className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
              <Icons.Activity className="w-4 h-4 text-emerald-400"/>
              {L.cfProfileSection}
            </div>

            {/* Row 1: existing Global Risk Intel fields */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="space-y-1">
                <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">{L.cfBizName}</label>
                <input
                  type="text"
                  value={businessName}
                  onChange={e => setBusinessName(e.target.value)}
                  placeholder="e.g. Coimbatore Cotton Mills"
                  className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-600 outline-none transition"
                />
              </div>
              <div className="space-y-1">
                <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">{L.cfKeyMaterials}</label>
                <input
                  type="text"
                  value={keyMaterials}
                  onChange={e => setKeyMaterials(e.target.value)}
                  placeholder="e.g. cotton, polyester"
                  className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-600 outline-none transition"
                />
              </div>
              <div className="space-y-1">
                <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">{L.cfSupplierCountries}</label>
                <input
                  type="text"
                  value={supplierCountries}
                  onChange={e => setSupplierCountries(e.target.value)}
                  placeholder="e.g. china, vietnam"
                  className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-600 outline-none transition"
                />
              </div>
            </div>

            {/* Divider */}
            <div className="border-t border-slate-800/70 pt-1">
              <p className="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">{L.cfSchemeProfile}</p>
            </div>

            {/* Row 2: Scheme Finder fields */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="space-y-1">
                <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">{L.cfSector}</label>
                <select
                  value={sector}
                  onChange={e => setSector(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3 py-2 text-sm text-white outline-none transition appearance-none cursor-pointer"
                >
                  <option value="">— Select sector —</option>
                  <option value="textile">Textile &amp; Apparel</option>
                  <option value="food processing">Food Processing</option>
                  <option value="auto components">Auto Components</option>
                  <option value="electronics">Electronics</option>
                  <option value="chemicals">Chemicals</option>
                  <option value="handicraft">Handicrafts</option>
                  <option value="it software">IT / Software Services</option>
                  <option value="agro">Agro-based</option>
                  <option value="pharma">Pharma</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div className="space-y-1">
                <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">{L.cfBizType}</label>
                <select
                  value={businessType}
                  onChange={e => setBusinessType(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3 py-2 text-sm text-white outline-none transition appearance-none cursor-pointer"
                >
                  <option value="manufacturing">Manufacturing</option>
                  <option value="service">Service</option>
                  <option value="trading">Trading</option>
                </select>
              </div>
              <div className="space-y-1">
                <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">{L.cfState}</label>
                <select
                  value={businessState}
                  onChange={e => setBusinessState(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3 py-2 text-sm text-white outline-none transition appearance-none cursor-pointer"
                >
                  <option value="">— Pan-India —</option>
                  <option value="andhra pradesh">Andhra Pradesh</option>
                  <option value="assam">Assam</option>
                  <option value="bihar">Bihar</option>
                  <option value="chhattisgarh">Chhattisgarh</option>
                  <option value="delhi">Delhi</option>
                  <option value="goa">Goa</option>
                  <option value="gujarat">Gujarat</option>
                  <option value="haryana">Haryana</option>
                  <option value="himachal pradesh">Himachal Pradesh</option>
                  <option value="jharkhand">Jharkhand</option>
                  <option value="karnataka">Karnataka</option>
                  <option value="kerala">Kerala</option>
                  <option value="madhya pradesh">Madhya Pradesh</option>
                  <option value="maharashtra">Maharashtra</option>
                  <option value="manipur">Manipur</option>
                  <option value="meghalaya">Meghalaya</option>
                  <option value="odisha">Odisha</option>
                  <option value="punjab">Punjab</option>
                  <option value="rajasthan">Rajasthan</option>
                  <option value="tamil nadu">Tamil Nadu</option>
                  <option value="telangana">Telangana</option>
                  <option value="uttar pradesh">Uttar Pradesh</option>
                  <option value="uttarakhand">Uttarakhand</option>
                  <option value="west bengal">West Bengal</option>
                  <option value="other">Other / UT</option>
                </select>
              </div>
            </div>

            {/* Row 3: Checkboxes */}
            <div className="flex flex-wrap gap-6 pt-1">
              <label className="flex items-center gap-2.5 cursor-pointer select-none group">
                <div
                  onClick={() => setWomenOwned(v => !v)}
                  className={`w-5 h-5 rounded-md border-2 flex items-center justify-center transition-all ${
                    womenOwned ? 'bg-emerald-500 border-emerald-500' : 'border-slate-600 bg-slate-900 group-hover:border-emerald-500/60'
                  }`}
                >
                  {womenOwned && <svg className="w-3 h-3 text-white" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>}
                </div>
                <span className="text-sm text-slate-300 font-medium">{L.cfWomenOwned}</span>
                <span className="text-[10px] text-emerald-500 font-semibold">{L.cfStandUp}</span>
              </label>
              <label className="flex items-center gap-2.5 cursor-pointer select-none group">
                <div
                  onClick={() => setExportOriented(v => !v)}
                  className={`w-5 h-5 rounded-md border-2 flex items-center justify-center transition-all ${
                    exportOriented ? 'bg-emerald-500 border-emerald-500' : 'border-slate-600 bg-slate-900 group-hover:border-emerald-500/60'
                  }`}
                >
                  {exportOriented && <svg className="w-3 h-3 text-white" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>}
                </div>
                <span className="text-sm text-slate-300 font-medium">{L.cfExportOriented}</span>
                <span className="text-[10px] text-emerald-500 font-semibold">{L.cfIesMda}</span>
              </label>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div
              className={`drop-zone rounded-xl p-6 flex flex-col items-center justify-center gap-3 cursor-pointer ${dragOver ? 'over' : ''}`}
              style={{ minHeight:'140px' }}
              onDragOver={e=>{e.preventDefault();setDragOver(true);}}
              onDragLeave={()=>setDragOver(false)}
              onDrop={e=>{e.preventDefault();setDragOver(false);if(e.dataTransfer.files?.[0]) handleFileUpload(e.dataTransfer.files[0]);}}
              onClick={()=>document.getElementById('csv-file-input').click()}
            >
              <input id="csv-file-input" type="file" accept=".csv,text/csv,image/png,image/jpeg,image/jpg" className="hidden"
                onChange={e=>{if(e.target.files?.[0]) handleFileUpload(e.target.files[0]);}}/>
              <div className="flex items-center gap-2 text-emerald-400">
                <Icons.Upload className="w-7 h-7"/>
                <Icons.Camera className="w-7 h-7 text-teal-400"/>
              </div>
              {csvFilename
                ? <div className="text-center"><div className="text-sm font-semibold text-emerald-400">✓ {csvFilename}</div></div>
                : (
                  <div className="text-center">
                    <div className="text-sm font-semibold text-slate-200">{L.cfDropzone}</div>
                    <div className="text-[11px] text-slate-400 mt-1">{L.cfDropzoneSub}</div>
                  </div>
                )
              }
            </div>

            {/* Ledger Photo Review Modal (opens after OCR extraction) */}
            <LedgerReviewModal
              lang={lang}
              reviewData={ledgerReviewData}
              onConfirm={confirmLedgerTransactions}
              onCancel={() => setLedgerReviewData(null)}
            />

            <div className="glass rounded-xl p-5 space-y-4 border border-slate-800">
              <div>
                <label className="text-xs font-bold text-slate-300 uppercase tracking-wider">{L.cfThresholdLabel}</label>
              </div>
              <div className="flex gap-2">
                <div className="relative flex-1">
                  <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">₹</span>
                  <input type="text" value={thresholdInput}
                    onChange={e=>setThresholdInput(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl pl-7 pr-3 py-2.5 text-sm text-white outline-none transition font-mono"/>
                </div>
                <button onClick={()=>{applyThreshold();setTimeout(reanalyze,0);}}
                  className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition">
                  {L.cfApply}
                </button>
              </div>
            </div>
          </div>

          {error && (
            <div className="flex items-start gap-3 p-4 rounded-xl bg-red-950/60 border border-red-800/60 text-red-300 text-sm">
              <Icons.AlertTriangle className="w-5 h-5 shrink-0 mt-0.5 text-red-400"/>
              {error}
            </div>
          )}

          {activeForecast && (
            <>
              {activeForecast.first_breach ? (
                <div className="p-4 rounded-xl bg-red-950/50 border border-red-700/60 flex items-start gap-4">
                  <div className="w-10 h-10 rounded-xl bg-red-500/20 flex items-center justify-center shrink-0">
                    <Icons.AlertTriangle className="w-5 h-5 text-red-400"/>
                  </div>
                  <div>
                    <div className="text-sm font-bold text-red-300">{L.cfThresholdWarn}</div>
                    <div className="text-sm text-red-200 mt-1">{activeForecast.first_breach.message}</div>
                  </div>
                </div>
              ) : (
                <div className="p-4 rounded-xl bg-emerald-950/40 border border-emerald-700/40 flex items-center gap-4">
                  <Icons.ShieldCheck className="w-6 h-6 text-emerald-400 shrink-0"/>

function LoanGaugeChart({ lang, score, maxScore = 100, tier, cibilEquiv }) {
  const L = LABELS[lang] || LABELS.en;
  const pct = Math.min(100, Math.max(0, score)) / maxScore;
  const color = score >= 85 ? '#22c55e' : score >= 70 ? '#14b8a6' : score >= 50 ? '#f59e0b' : '#ef4444';
  
  return (
    <div className="relative flex flex-col items-center justify-center p-4">
      <svg className="w-56 h-32 overflow-visible" viewBox="0 0 200 110">
        <defs>
          <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="#ef4444" />
            <stop offset="35%" stopColor="#f59e0b" />
            <stop offset="70%" stopColor="#14b8a6" />
            <stop offset="100%" stopColor="#22c55e" />
          </linearGradient>
        </defs>
        {/* Background Track Arc */}
        <path
          d="M 20 100 A 80 80 0 0 1 180 100"
          fill="none"
          stroke="#1e293b"
          strokeWidth="16"
          strokeLinecap="round"
        />
        {/* Gradient Progress Arc */}
        <path
          d="M 20 100 A 80 80 0 0 1 180 100"
          fill="none"
          stroke="url(#gaugeGrad)"
          strokeWidth="16"
          strokeLinecap="round"
          strokeDasharray="251.2"
          strokeDashoffset={251.2 * (1 - pct)}
          style={{ transition: 'stroke-dashoffset 0.6s ease-out' }}
        />
        {/* Score Text in Arc Center */}
        <text x="100" y="80" textAnchor="middle" fill="#ffffff" className="font-extrabold text-3xl font-sans" style={{ fontSize: '32px', fontWeight: '800' }}>
          {score.toFixed(1)}
        </text>
        <text x="100" y="98" textAnchor="middle" fill="#94a3b8" className="text-xs font-sans" style={{ fontSize: '11px' }}>
          {L.lsOutOf} {maxScore}
        </text>
      </svg>
      
      <div className="text-center mt-1">
        <span className="inline-block px-3 py-0.5 rounded-full text-xs font-bold border" style={{ backgroundColor: `${color}15`, color: color, borderColor: `${color}40` }}>
          {(lang === 'ta' && STATUS_MAP.ta[tier]) ? STATUS_MAP.ta[tier] : tier}
        </span>
        <div className="text-xs text-slate-400 mt-1 font-medium">
          {L.cibilLabel} <span className="text-slate-600">{L.cibilEquiv}</span>: <strong className="text-white font-bold">{cibilEquiv} / 900</strong>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════

══════════════════════════════════════════════════════ */
function renderFormattedText(text) {
  if (!text) return null;
  // Simple markdown-style rendering for bold **text** and bullet points
  const lines = text.split('\n');
  return lines.map((line, lineIdx) => {
    // Process bold text
    const parts = line.split(/(\*\*.*?\*\*)/g);
    const lineContent = parts.map((part, partIdx) => {
      if (part.startsWith('**') && part.endsWith('**')) {
        return <strong key={partIdx} className="font-bold text-white">{part.slice(2, -2)}</strong>;
      }
      return part;
    });

    return (
      <div key={lineIdx} className={line.startsWith('•') ? 'pl-3 my-0.5' : lineIdx > 0 ? 'mt-1.5' : ''}>
        {lineContent}
      </div>
    );
  });
}

function ChatView({ lang, activeTab, profileMode, uploadedFull }) {
  const L = LABELS[lang] || LABELS.en;

  /* ── 1. Fetch demo-profile data once (for when profileMode === 'demo') ── */
  const [demoLoan,   setDemoLoan]   = useState(null);
  const [demoRisk,   setDemoRisk]   = useState(null);
  const [demoSchemes,setDemoSchemes]= useState([]);
  const [demoCash,   setDemoCash]   = useState(null);

  useEffect(() => {
    fetch(`${API}/loan-score`).then(r=>r.json()).then(setDemoLoan).catch(()=>{});
    fetch(`${API}/risk-radar`).then(r=>r.json()).then(setDemoRisk).catch(()=>{});
    fetch(`${API}/scheme-finder`).then(r=>r.json()).then(d=>setDemoSchemes(d.schemes||[])).catch(()=>{});
    fetch(`${API}/cash-flow`).then(r=>r.json()).then(setDemoCash).catch(()=>{});
  }, []);

  /* ── 2. Resolve active data (uploaded vs demo) ── */
  const isUploaded = profileMode === 'uploaded' && uploadedFull;

  const cashSrc   = isUploaded ? uploadedFull.cash_flow?.summary      : demoCash?.summary;
  const loanSrc   = isUploaded ? uploadedFull.loan_score               : demoLoan;
  const riskSrc   = isUploaded ? uploadedFull.risk_radar               : demoRisk;
  const schemeSrc = isUploaded ? (uploadedFull.scheme_finder?.schemes||[]) : demoSchemes;

  /* ── 3. Formatters ── */
  const fmtL = v => {
    if (v == null) return '—';
    const abs = Math.abs(v);
    if (abs >= 10000000) return `₹${(v/10000000).toFixed(2)}Cr`;
    if (abs >= 100000)   return `₹${(v/100000).toFixed(2)}L`;
    if (abs >= 1000)     return `₹${(v/1000).toFixed(1)}K`;
    return `₹${Math.round(v).toLocaleString('en-IN')}`;
  };

  /* ── 4. Build 5 answers from live data ── */
  const buildAnswer = (q) => {
    const lower = q.toLowerCase();

    /* Q1 — Hiring */
    if (/hire|staff|employ|headcount|recruit|people|worker/i.test(lower)) {
      const inflow  = cashSrc?.monthly_inflow  || 0;
      const outflow = cashSrc?.monthly_outflow || 0;
      const surplus = inflow - outflow;
      const maxHires = surplus > 0 ? Math.floor(surplus / 30000) : 0;
      return {
        text: `Based on your current numbers: your monthly net cashflow is **${fmtL(inflow)}** minus **${fmtL(outflow)}** = **${fmtL(surplus)}**.\n\nAdding staff at ₹25,000-35,000/month each is manageable up to roughly **${maxHires} hires** before your buffer tightens. I'd phase hiring rather than doing it all at once, especially around your GST payment date.`,
        insights: [`Surplus: ${fmtL(surplus)}/mo`, `Max Hires: ~${maxHires}`, `Runway: ${cashSrc?.runway_months ?? '—'} mo`],
        suggested: ['What is my loan readiness score?', 'What are my biggest risks?', 'Which government schemes do I qualify for?']
      };
    }

    /* Q2 — Loan / Borrowing */
    if (/loan|borrow|credit|eligible|ready|lending|finance|bank|pre.approv/i.test(lower)) {
      const calc    = loanSrc?.calculation;
      const score   = calc?.overall_score?.toFixed(1)  ?? '—';
      const tier    = calc?.score_tier                  ?? '—';
      const cibil   = calc?.cibil_equivalent            ?? '—';
      const factors = calc?.factors || [];
      const sorted  = [...factors].sort((a,b) => b.score - a.score);
      const best    = sorted[0]?.name ?? '—';
      const worst   = sorted[sorted.length-1]?.name ?? '—';
      const lenders = loanSrc?.matched_lenders || [];
      const maxAmt  = lenders.length
        ? `${fmtL(Math.min(...lenders.map(l=>l.max_amount)))}–${fmtL(Math.max(...lenders.map(l=>l.max_amount)))}`
        : '—';
      return {
        text: `Yes - your Loan Readiness Score is **${score}/100** (**${tier}** tier, CIBIL-equivalent **${cibil}**). Your strongest factor is **${best}**; your main drag is **${worst}**. You're likely pre-approved in the range of **${maxAmt}** depending on lender.`,
        insights: [`Score: ${score}/100`, `CIBIL equiv: ${cibil}`, `Range: ${maxAmt}`],
        suggested: ['Can I hire 3 more employees?', 'Which government schemes do I qualify for?', 'What are my biggest risks?']
      };
    }

    /* Q3 — Risk */
    if (/risk|danger|concern|vulnerab|threat|warning|flag/i.test(lower)) {
      const level   = riskSrc?.risk_level ?? '—';
      const metrics = riskSrc?.metrics || [];
      const top     = metrics.length ? metrics.reduce((a,b) => b.score > a.score ? b : a, metrics[0]) : null;
      const inflow  = cashSrc?.monthly_inflow  || 1;
      const outflow = cashSrc?.monthly_outflow || 0;
      const ratio   = ((outflow / inflow) * 100).toFixed(1);
      return {
        text: `Your top flagged risk is **${top?.name ?? '—'}** at **${top?.score ?? '—'}/100**. Your outflow-to-inflow pressure is **${ratio}%**. Overall risk index is **${level}**.`,
        insights: [`Risk level: ${level}`, `Top risk: ${top?.name ?? '—'}`, `Outflow ratio: ${ratio}%`],
        suggested: ['Can I hire 3 more employees?', 'What is my loan readiness score?', 'Which government schemes do I qualify for?']
      };
    }

    /* Q4 — Large purchase / affordability */
    if (/buy|purchas|afford|spend|invest|equipment|machine|supplies|lakh|crore|capex/i.test(lower)) {
      const runway  = cashSrc?.runway_months ?? '—';
      return {
        text: `Your current runway is **${runway} months** at present spending. A large purchase would reduce your buffer for that month - I'd recommend spacing it across purchase cycles or timing it around your GST liability date to avoid a cash strain overlap.`,
        insights: [`Balance: ${fmtL(cashSrc?.current_balance ?? 0)}`, `Runway: ${runway} mo`],
        suggested: ['Can I hire 3 more employees?', 'What is my loan readiness score?', 'Which government schemes do I qualify for?']
      };
    }

    /* Q5 — Schemes / subsidies / govt */
    if (/scheme|subsidy|grant|government|govt|pmegp|cgtmse|zed|eligible for|qualify/i.test(lower)) {
      const top3  = schemeSrc.slice(0, 3);
      const list  = top3.map(s => `• **${s.title}** (${s.match_percentage}% match)`).join('\n');
      const best  = top3[0];
      return {
        text: `Based on your financials, you match:\n\n${list || '• No scheme data loaded yet'}\n\n**${best?.title ?? 'Top scheme'}** is your strongest fit given your current loan readiness score.`,
        insights: top3.map(s => `${s.match_percentage}% — ${s.title.split(' ').slice(0,3).join(' ')}`),
        suggested: ['What is my loan readiness score?', 'Can I hire 3 more employees?', 'What are my biggest risks?']
      };
    }

    /* Fallback — unmatched */
    return {
      text: `This demo runs in offline fallback mode with pre-built responses for common questions (hiring, loans, risk, purchases, schemes) to keep it fast and reliable - the live version connects to Gemini API reasoning for open-ended questions.`,
      insights: [],
      suggested: ['Can I hire 3 more employees?', 'What is my loan readiness score?', 'What are my biggest risks?']
    };
  };

  /* ── 5. Initial greeting built from live data ── */
  const buildGreeting = () => {
    const balance = cashSrc?.current_balance;
    const runway  = cashSrc?.runway_months;
    const lscore  = loanSrc?.calculation?.overall_score?.toFixed(0);
    return {
      sender: 'assistant',
      text: L.chatGreeting,
      insights: [
        balance != null ? `Balance: ${fmtL(balance)}`       : 'Balance: loading...',
        runway  != null ? `Money lasts: ${runway} months`   : 'Runway: loading...',
        lscore  != null ? `Loan score: ${lscore}/100`       : 'Loan score: loading...',
      ],
      suggested: ['Can I hire 3 more employees?', 'What is my loan readiness score?', 'What are my biggest risks?']
    };
  };

  const [messages, setMessages] = useState(() => [buildGreeting()]);

  /* Refresh greeting chips when data loads */
  useEffect(() => {
    if (cashSrc || loanSrc) {
      setMessages(prev => {
        if (prev.length === 1 && prev[0].sender === 'assistant') {
          return [buildGreeting()];
        }
        return prev;
      });
    }
  }, [cashSrc, loanSrc, lang]);

  const [input, setInput]     = useState('');
  const [loading, setLoading] = useState(false);
  const endRef = useRef(null);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, loading]);

  /* ── 6. Send handler — tries live /api/chat first, falls back to buildAnswer ── */
  const send = async (textToSend) => {
    const query = (textToSend || input).trim();
    if (!query || loading) return;
    setInput('');
    setLoading(true);

    const userMsg = { sender: 'user', text: query };
    const tempBotMsg = { sender: 'assistant', text: '', loading: true };

    // Append user query and temporary loading bubble
    setMessages(prev => [...prev, userMsg, tempBotMsg]);

    let botMsg = null;

    try {
      // Format history for backend API
      const historyPayload = messages
        .filter(m => !m.loading && m.text)
        .map(m => ({
          role: m.sender === 'user' ? 'user' : 'assistant',
          content: m.text
        }));

      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: query,
          active_tab: activeTab || 'cashflow',
          history: historyPayload,
          language: lang,
          profile_data: (profileMode === 'uploaded' && uploadedFull) ? uploadedFull : null
        })
      });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }

      const data = await res.json();

      if (data.error) {
        throw new Error(data.error);
      }

      botMsg = {
        sender: 'assistant',
        text: data.response || 'No response received from AI advisor.',
        insights: data.insights || [],
        suggested: data.suggested_actions || []
      };
    } catch (err) {
      console.warn('[COPILOT CHAT] API call failed or server offline, using rule-based fallback:', err);
      const offlineAnswer = buildAnswer(query);
      botMsg = { sender: 'assistant', ...offlineAnswer };
    }

    // Replace loading placeholder with final message
    setMessages(prev => prev.map(m => m.loading ? botMsg : m));
    setLoading(false);
  };

  const clearThread = () => setMessages([buildGreeting()]);

  return (
    <div className="h-[calc(100vh-8rem)] flex flex-col glass rounded-2xl overflow-hidden border border-slate-800">
      {/* Header */}
      <div className="p-4 border-b border-slate-800 bg-slate-900/70 flex items-center justify-between">
        <div className="flex items-center gap-3">
          <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white flex items-center justify-center shadow-md">
            <Icons.Bot className="w-5 h-5" />
          </div>
          <div>
            <div className="font-bold text-sm text-white flex items-center gap-2">
              {L.chatTitle}
              <span className="text-[10px] px-1.5 py-0.5 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-full font-mono">{L.chatBadge}</span>
            </div>
            <div className="text-[10px] text-slate-400">{L.chatSubtitle}</div>
          </div>
        </div>
        <button
          onClick={clearThread}
          className="text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white border border-slate-700 transition"
          title="Clear the chat"
        >
          {L.chatClear}
        </button>
      </div>

      {/* Scrolling Chat Thread */}
      <div className="flex-1 overflow-y-auto p-4 space-y-4">
        {messages.map((m, i) => (
          <div key={i} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
            <div className={`max-w-2xl p-4 rounded-2xl text-xs md:text-sm leading-relaxed ${
              m.sender === 'user'
                ? 'bg-emerald-600 text-white rounded-br-none shadow-md'
                : 'bg-slate-900/90 border border-slate-800 text-slate-200 rounded-bl-none shadow-lg'
            }`}>
              {m.loading ? (
                <div className="flex items-center gap-2 py-1 text-emerald-400">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse delay-150"></span>
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse delay-300"></span>
                  <span className="text-xs text-slate-400 ml-1 font-medium">{L.chatAnalyzing}</span>
                </div>
              ) : (
                renderFormattedText(m.text)
              )}

              {/* Insight chips */}
              {!m.loading && m.insights && m.insights.length > 0 && (
                <div className="mt-3 pt-3 border-t border-slate-800/80 flex flex-wrap gap-1.5">
                  {m.insights.map((ins, idx) => (
                    <span key={idx} className="text-[10px] font-medium px-2 py-0.5 rounded-md bg-emerald-950/80 text-emerald-300 border border-emerald-800/50">
                      ⚡ {ins}
                    </span>
                  ))}
                </div>
              )}
            </div>

            {/* Quick follow-up chips */}
            {!m.loading && m.suggested && m.suggested.length > 0 && i === messages.length - 1 && (
              <div className="flex flex-wrap gap-2 mt-2.5 max-w-2xl">
                {m.suggested.map((sug, idx) => (
                  <button
                    key={idx}
                    disabled={loading}
                    onClick={() => send(sug)}
                    className="text-xs px-3 py-1.5 rounded-full bg-slate-900 hover:bg-slate-800 text-emerald-400 border border-slate-800 hover:border-emerald-500/40 transition shadow-sm disabled:opacity-50"
                  >
                    💬 {sug}
                  </button>
                ))}
              </div>
            )}
          </div>
        ))}
        <div ref={endRef} />
      </div>

      {/* Input bar */}
      <form onSubmit={e => { e.preventDefault(); send(); }} className="p-3 border-t border-slate-800 bg-slate-900/90 flex items-center gap-2">
        <input
          type="text"
          value={input}
          disabled={loading}
          onChange={e => setInput(e.target.value)}
          placeholder={loading ? L.chatThinking : L.chatPlaceholder}
          className="flex-1 bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-4 py-2.5 text-xs md:text-sm text-white placeholder-slate-500 outline-none transition disabled:opacity-50"
        />
        <button
          type="submit"
          disabled={!input.trim() || loading}
          className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white rounded-xl font-bold text-xs flex items-center gap-2 transition"
        >
          <span>{loading ? L.chatLoading : L.chatSend}</span>
          <Icons.Send className="w-4 h-4" />
        </button>
      </form>
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   LIVE MARKET INDICATORS (Decoupled Global Data Component)
══════════════════════════════════════════════════════ */
function LiveMarketIndicators({ lang }) {
  const L = LABELS[lang] || LABELS.en;
  const [indicators, setIndicators] = useState(() => {
    try {
      const cached = sessionStorage.getItem('live_market_indicators_cache_v2');
      if (cached) return JSON.parse(cached);
    } catch (e) {}
    return null;
  });
  const [loading, setLoading] = useState(!indicators);

  useEffect(() => {
    if (indicators) return;

    let isMounted = true;
    const fetchAll = async () => {
      const results = {
        usdInr: { status: 'loading' },
        crude:  { status: 'loading' },
        cotton: { status: 'loading' },
        cpi:    { status: 'loading' }
      };

      // 1. USD/INR - Frankfurter API
      try {
        const res = await fetch('https://api.frankfurter.dev/v1/latest?from=USD&to=INR');
        const d = await res.json();
        if (d && d.rates && d.rates.INR) {
          results.usdInr = {
            status: 'ok',
            val: `₹${d.rates.INR.toFixed(2)}`,
            sub: `Date: ${d.date}`,
            change: '+0.35%'
          };
        } else {
          results.usdInr = { status: 'unavailable' };
        }
      } catch (e) {
        results.usdInr = { status: 'unavailable' };
      }

      // 2. Crude Oil - World Bank Commodity Price Data (Pink Sheet)
      try {
        const res = await fetch('http://api.worldbank.org/v2/country/WLD/indicator/EP.PMP.SGAS.CD?format=json');
        const d = await res.json();
        if (Array.isArray(d) && d[1] && d[1][0] && d[1][0].value !== null) {
          const latest = d[1][0].value;
          const prior = d[1][1] ? d[1][1].value : latest;
          const diff = prior ? (((latest - prior) / prior) * 100).toFixed(1) : '0.0';
          results.crude = {
            status: 'ok',
            val: `$${latest.toFixed(2)}/bbl`,
            sub: `Period: ${d[1][0].date}`,
            change: `${diff >= 0 ? '+' : ''}${diff}%`
          };
        } else {
          results.crude = { status: 'unavailable' };
        }
      } catch (e) {
        results.crude = { status: 'unavailable' };
      }

      // 3. Cotton Price - World Bank Commodity Price Data (Pink Sheet)
      try {
        const res = await fetch('http://api.worldbank.org/v2/country/WLD/indicator/PCOTTIND.USD?format=json');
        const d = await res.json();
        if (Array.isArray(d) && d[1] && d[1][0] && d[1][0].value !== null) {
          const latest = d[1][0].value;
          const prior = d[1][1] ? d[1][1].value : latest;
          const diff = prior ? (((latest - prior) / prior) * 100).toFixed(1) : '0.0';
          results.cotton = {
            status: 'ok',
            val: `${latest.toFixed(1)} c/lb`,
            sub: `Period: ${d[1][0].date}`,
            change: `${diff >= 0 ? '+' : ''}${diff}%`
          };
        } else {
          results.cotton = { status: 'unavailable' };
        }
      } catch (e) {
        results.cotton = { status: 'unavailable' };
      }

      // 4. India Inflation CPI - World Bank API (indicator FP.CPI.TOTL.ZG, country IN)
      try {
        const res = await fetch('http://api.worldbank.org/v2/country/IN/indicator/FP.CPI.TOTL.ZG?format=json');
        const d = await res.json();
        if (Array.isArray(d) && d[1] && d[1][0] && d[1][0].value !== null) {
          const latest = d[1][0].value;
          const prior = d[1][1] ? d[1][1].value : null;
          const diff = prior !== null ? (latest - prior).toFixed(2) : null;
          results.cpi = {
            status: 'ok',
            val: `${latest.toFixed(2)}%`,
            sub: `Year: ${d[1][0].date} (Annual CPI)`,
            change: diff ? `${diff >= 0 ? '+' : ''}${diff}% vs ${d[1][1].date}` : null
          };
        } else {
          results.cpi = { status: 'unavailable' };
        }
      } catch (e) {
        results.cpi = { status: 'unavailable' };
      }

      if (isMounted) {
        setIndicators(results);
        setLoading(false);
        try { sessionStorage.setItem('live_market_indicators_cache_v2', JSON.stringify(results)); } catch (e) {}
      }
    };

    fetchAll();
    return () => { isMounted = false; };
  }, [indicators]);

  const cards = [
    {
      title: 'USD / INR Rate',
      source: 'Frankfurter API',
      data: indicators?.usdInr
    },
    {
      title: 'Crude Oil (Brent)',
      source: 'World Bank Commodity',
      data: indicators?.crude
    },
    {
      title: 'Cotton (Pink Sheet)',
      source: 'World Bank Commodity',
      data: indicators?.cotton
    },
    {
      title: 'India Inflation (CPI)',
      source: 'World Bank API',
      data: indicators?.cpi
    }
  ];

  return (
    <div className="glass p-5 rounded-2xl border border-slate-800 space-y-3">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <Icons.Activity className="w-4 h-4 text-emerald-400" />
          <h3 className="text-sm font-bold text-white uppercase tracking-wider">{L.lmiTitle}</h3>
          <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 font-mono">{L.lmiLive}</span>
        </div>
        <span className="text-[10px] text-slate-500 font-mono">{L.lmiCached}</span>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        {cards.map((c, i) => {
          const d = c.data;
          const isOk = d && d.status === 'ok';

          return (
            <div key={i} className="p-4 rounded-xl bg-slate-900/80 border border-slate-800/80 space-y-2">
              <div className="flex items-center justify-between text-[11px]">
                <span className="font-semibold text-slate-300">{c.title}</span>
                <span className="text-[10px] text-slate-500 font-mono">{c.source}</span>
              </div>

              {loading && !d ? (
                <div className="text-xs text-slate-500 animate-pulse py-1">{L.lmiFetching}</div>
              ) : isOk ? (
                <div>
                  <div className="text-xl font-extrabold text-white font-mono">{d.val}</div>
                  <div className="flex items-center justify-between text-[10px] mt-1">
                    <span className="text-slate-400">{d.sub}</span>
                    {d.change && (
                      <span className={`font-bold ${d.change.startsWith('-') ? 'text-emerald-400' : 'text-amber-400'}`}>
                        {d.change}
                      </span>
                    )}
                  </div>
                </div>
              ) : (
                <div className="py-1">
                  <div className="text-xs font-bold text-amber-400/90 flex items-center gap-1">
                    <span>{L.lmiUnavailable}</span>
                  </div>
                  <div className="text-[10px] text-slate-500 mt-0.5">{L.lmiApiOffline}</div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   GLOBAL RISK INTELLIGENCE & MACRO MONITORING
══════════════════════════════════════════════════════ */
function GlobalRiskView({ lang, profileMode, uploadedFull }) {
  const L = LABELS[lang] || LABELS.en;
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [expanded, setExpanded] = useState({});

  // Determine whether we have a custom uploaded exposure profile to use
  const customExposure = (profileMode === 'uploaded' && uploadedFull?.global_exposure)
    ? uploadedFull.global_exposure
    : null;

  useEffect(() => {
    setLoading(true);
    setError(null);
    const fetchData = customExposure
      ? fetch(`${API}/global-risk/match?lang=${lang}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(customExposure)
        })
      : fetch(`${API}/global-risk?lang=${lang}`);

    fetchData
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}`);
        return r.json();
      })
      .then(d => {
        if (!d) throw new Error('Global Risk API returned null or empty response.');
        setData(d);
        setLoading(false);
      })
      .catch(e => {
        console.error('[GLOBAL RISK FETCH ERROR]', e);
        setError(e.message || 'Failed to load global risk data.');
        setLoading(false);
      });
  }, [profileMode, uploadedFull, lang]);

  const toggle = (id) => setExpanded(prev => ({ ...prev, [id]: !prev[id] }));

  if (loading) return (
    <div className="space-y-6">
      <LiveMarketIndicators lang={lang} />
      <div className="flex items-center justify-center h-64 text-slate-400 gap-3">
        <div className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></div>
        {L.loadGlobal}
      </div>
    </div>
  );
  if (error || !data) return (
    <div className="space-y-6">
      <LiveMarketIndicators lang={lang} />
      <div className="glass rounded-2xl p-6 border border-red-800/60 bg-red-950/20 text-red-300 space-y-2">
        <div className="flex items-center gap-2 font-bold text-sm text-red-400">
          <Icons.AlertTriangle className="w-5 h-5 text-red-400" />
          <span>Global Risk Intelligence Error</span>
        </div>
        <p className="text-xs text-red-300">{error || 'Data is unavailable for this business profile.'}</p>
      </div>
    </div>
  );

  const exp = data.business_exposure || {
    name: 'Business Profile',
    materials: [],
    supplier_countries: [],
    currency_exposure: [],
    export_markets: []
  };
  const events = data.events || [];
  const filtered_out_events = data.filtered_out_events || [];
  const total_events_scanned = data.total_events_scanned || 0;
  const matched_events = data.matched_events || 0;
  const last_updated = data.last_updated || '2026-07-28';
  const data_sources = data.data_sources || [];

  const highCount   = events.filter(e => e.severity === 'high').length;
  const medCount    = events.filter(e => e.severity === 'medium').length;
  const lowCount    = events.filter(e => e.severity === 'low').length;

  return (
    <div className="space-y-6">
      <LiveMarketIndicators lang={lang} />

      {/* ── Header bar ── */}
      <div className="glass rounded-2xl p-5 border border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div className="flex items-center gap-4">
          <div className="w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-700 to-indigo-600 flex items-center justify-center shadow-lg shrink-0">
            <Icons.Globe className="w-6 h-6 text-white"/>
          </div>
          <div>
            <div className="font-bold text-lg text-white">{L.grTitle}</div>
            <div className="text-xs text-slate-400 mt-0.5">
              {L.grCheckedEvents} <strong className="text-slate-200">{total_events_scanned}</strong> {L.grWorldEvents} ·
              <strong className="text-emerald-400"> {matched_events} {L.grAffect}</strong> ·
              <strong className="text-slate-400"> {filtered_out_events.length} {L.grNotRelevant}</strong>
            </div>
          </div>
        </div>
        <div className="flex items-center gap-3 flex-wrap">
          {highCount > 0 && <span className="text-xs px-2.5 py-1 rounded-full bg-red-950/60 text-red-300 border border-red-700/50 font-medium">{highCount} {L.grHighImpact}</span>}
          {medCount  > 0 && <span className="text-xs px-2.5 py-1 rounded-full bg-amber-950/60 text-amber-300 border border-amber-700/50 font-medium">{medCount} {L.grMedium}</span>}
          {lowCount  > 0 && <span className="text-xs px-2.5 py-1 rounded-full bg-emerald-950/60 text-emerald-300 border border-emerald-700/50 font-medium">{lowCount} {L.grOpportunity}</span>}
          <span className="text-[10px] text-slate-500 font-mono">{L.grUpdated} {last_updated}</span>
        </div>
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-4 gap-6">

        {/* ── Left: Exposure Profile Sidebar ── */}
        <div className="xl:col-span-1 space-y-4">
          <div className="glass rounded-2xl p-4 border border-slate-800">
            <div className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-3">{L.grExposureTitle}</div>
            <div className="font-semibold text-sm text-slate-100 mb-4">{exp.name}</div>

            <div className="space-y-3 text-xs">
              <div>
                <div className="text-[10px] text-slate-500 uppercase tracking-wider mb-1.5">{L.grMaterials}</div>
                <div className="flex flex-wrap gap-1">
                  {exp.materials.map(m => (
                    <span key={m} className="px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">{m}</span>
                  ))}
                </div>
              </div>
              <div>
                <div className="text-[10px] text-slate-500 uppercase tracking-wider mb-1.5">{L.grSourceFrom}</div>
                <div className="flex flex-wrap gap-1">
                  {exp.supplier_countries.map(c => (
                    <span key={c} className="px-2 py-0.5 rounded bg-blue-950/50 text-blue-300 border border-blue-800/40 capitalize">{c}</span>
                  ))}
                </div>
              </div>
              <div>
                <div className="text-[10px] text-slate-500 uppercase tracking-wider mb-1.5">{L.grCurrencies}</div>
                <div className="flex flex-wrap gap-1">
                  {exp.currency_exposure.map(c => (
                    <span key={c} className="px-2 py-0.5 rounded bg-yellow-950/40 text-yellow-300 border border-yellow-800/40 uppercase font-mono">{c}</span>
                  ))}
                </div>
              </div>
              <div>
                <div className="text-[10px] text-slate-500 uppercase tracking-wider mb-1.5">{L.grExportTo}</div>
                <div className="flex flex-wrap gap-1">
                  {exp.export_markets.map(m => (
                    <span key={m} className="px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 capitalize">{m}</span>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* Data sources */}
          <div className="glass rounded-2xl p-4 border border-slate-800">
            <div className="text-[10px] uppercase font-bold text-slate-500 tracking-wider mb-2">{L.grDataSources}</div>
            <div className="space-y-1.5">
              {data_sources.map(s => (
                <div key={s} className="text-[11px] text-slate-400 flex items-center gap-1.5">
                  <div className="w-1 h-1 rounded-full bg-slate-600 shrink-0"></div>{s}
                </div>
              ))}
            </div>
          </div>

          {/* Filtered out events */}
          {filtered_out_events.length > 0 && (
            <div className="glass rounded-2xl p-4 border border-slate-800/60 opacity-70">
              <div className="text-[10px] uppercase font-bold text-slate-500 tracking-wider mb-2">{L.grSkipped} ({filtered_out_events.length})</div>
              <div className="space-y-2">
                {filtered_out_events.map(e => {
                  const cm = CATEGORY_META[e.category] || CATEGORY_META.tariff;
                  return (
                    <div key={e.id} className="flex items-start gap-2">
                      <span className={`text-[9px] px-1.5 py-0.5 rounded border font-medium shrink-0 mt-0.5 ${cm.color}`}>{cm.label}</span>
                      <span className="text-[11px] text-slate-500 leading-tight">{e.event_name}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>

        {/* ── Right: Matched Impact Cards ── */}
        <div className="xl:col-span-3 space-y-4">
          {events.length === 0 && (
            <div className="glass rounded-2xl p-8 border border-slate-800 text-center text-slate-400">
              {L.grNone}
            </div>
          )}

          {events.map(evt => {
            const sev = SEVERITY_META[evt.severity] || SEVERITY_META.medium;
            const cat = CATEGORY_META[evt.category] || CATEGORY_META.tariff;
            const isOpen = expanded[evt.id];

            return (
              <div key={evt.id} className={`glass rounded-2xl border transition-all duration-200 ${sev.ring}`}>

                {/* Card header — always visible */}
                <div
                  className="p-5 cursor-pointer flex items-start gap-4"
                  onClick={() => toggle(evt.id)}
                >
                  {/* Severity dot + bar */}
                  <div className="flex flex-col items-center gap-1.5 pt-0.5 shrink-0">
                    <div className={`w-3 h-3 rounded-full ${sev.dot} shadow-md`}></div>
                    <div className={`w-0.5 h-10 rounded-full opacity-40 ${sev.bar}`}></div>
                  </div>

                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap mb-1.5">
                      <span className={`text-[10px] px-2 py-0.5 rounded-md border font-bold uppercase tracking-wide ${cat.color}`}>{cat.label}</span>
                      <span className={`text-[10px] px-2 py-0.5 rounded-md border font-medium ${sev.badge}`}>{sev.label}</span>
                      <span className="text-[10px] text-slate-500 font-mono">{evt.date}</span>
                    </div>
                    <div className="font-bold text-sm text-slate-100 leading-snug">{evt.event_name}</div>
                    <div className="text-xs text-slate-400 mt-1 leading-relaxed line-clamp-2">{evt.description}</div>

                    <div className="mt-2 flex items-center gap-2 flex-wrap">
                      {evt.matched_triggers.map((trigger, ti) => {
                        const ACRONYMS = new Set(['usd','inr','eur','gbp','cny','jpy','aed','sgd','usa','uk','uae','eu','drc']);
                        const KNOWN_CURRENCIES = new Set(['usd','inr','eur','gbp','cny','jpy','aed','sgd']);
                        const KNOWN_COUNTRIES = new Set(['china','usa','united states','vietnam','germany','india','taiwan','bangladesh','japan','uk','uae']);

                        const raw = typeof trigger === 'object' ? trigger.value : trigger;
                        let type = typeof trigger === 'object' ? trigger.type : null;

                        if (!type) {
                          const l = String(raw).toLowerCase();
                          if (KNOWN_CURRENCIES.has(l)) type = 'currency';
                          else if (KNOWN_COUNTRIES.has(l)) type = 'country';
                          else type = 'material';
                        }

                        const display = ACRONYMS.has(String(raw).toLowerCase())
                          ? String(raw).toUpperCase()
                          : String(raw).replace(/\b\w/g, c => c.toUpperCase());

                        let labelPrefix, chipColor;
                        if (type === 'currency') {
                          labelPrefix = L.grTagCurrency || 'Currency Impact:';
                          chipColor = 'bg-yellow-950/60 text-yellow-300 border-yellow-800/40';
                        } else if (type === 'country') {
                          labelPrefix = L.grTagCountry || 'Related Country:';
                          chipColor = 'bg-blue-950/60 text-blue-300 border-blue-800/40';
                        } else {
                          labelPrefix = L.grTagAffects || 'Affects Your:';
                          chipColor = 'bg-indigo-950/60 text-indigo-300 border-indigo-800/40';
                        }

                        return (
                          <span key={ti} className={`text-[10px] px-2 py-0.5 rounded border font-medium ${chipColor}`}>
                            {labelPrefix} {display}
                          </span>
                        );
                      })}
                    </div>
                  </div>

                  <div className={`text-slate-400 transition-transform duration-200 shrink-0 ${isOpen ? 'rotate-180' : ''}`}>
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                  </div>
                </div>

                {/* Expanded impact cards */}
                {isOpen && (
                  <div className="px-5 pb-5 space-y-3 border-t border-slate-800/60 pt-4">
                    <div className="text-[10px] uppercase font-bold text-slate-500 tracking-wider mb-1">{L.grImpactTitle}</div>
                    {evt.matched_impacts.map((impact, idx) => (
                      <div key={idx} className="rounded-xl bg-slate-900/60 border border-slate-800 p-4 space-y-3">
                        <div className="flex items-center gap-2">
                          <span className="text-[10px] px-2 py-0.5 rounded bg-indigo-950/60 text-indigo-300 border border-indigo-800/40 capitalize font-medium">
                            {impact.trigger}
                          </span>
                        </div>

                        <div>
                          <div className="text-[10px] uppercase font-bold text-slate-500 tracking-wider mb-1">{L.grHowAffects}</div>
                          <p className="text-xs text-slate-300 leading-relaxed">{impact.why_it_matters}</p>
                        </div>

                        <div className={`rounded-lg p-3 border ${evt.severity === 'high' ? 'bg-red-950/20 border-red-800/30' : evt.severity === 'medium' ? 'bg-amber-950/20 border-amber-800/30' : 'bg-emerald-950/20 border-emerald-800/30'}`}>
                          <div className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1">{L.grPossibleEffect}</div>
                          <p className={`text-xs font-semibold leading-relaxed ${evt.severity === 'high' ? 'text-red-300' : evt.severity === 'medium' ? 'text-amber-300' : 'text-emerald-300'}`}>
                            {impact.estimated_impact}
                          </p>
                        </div>

                        <div className="rounded-lg p-3 bg-slate-900/80 border border-slate-700/60">
                          <div className="text-[10px] uppercase font-bold text-slate-500 tracking-wider mb-1">{L.grWhatToDo}</div>
                          <p className="text-xs text-slate-200 leading-relaxed">{impact.action}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
